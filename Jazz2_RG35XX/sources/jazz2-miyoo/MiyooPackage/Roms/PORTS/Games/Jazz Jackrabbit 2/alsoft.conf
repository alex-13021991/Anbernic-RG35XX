# OpenAL Soft configuration for the Miyoo Mini. Selected by ALSOFT_CONF in launch_jazz2.sh.
#
# The two settings that actually matter for this device - a power-of-two period and 16-bit output
# - cannot be set from here at all: the SDL2 backend opens the device before this file is applied
# and then overwrites the parameters with whatever SDL returned. They are patched into our own
# OpenAL build instead (docker/build-openal.sh).
#
# What is left is only about cost. The A7 runs the game at roughly 30 FPS with nothing to spare,
# and the game is 2D: point resampling and no HRTF are the cheap choices, and neither is audible
# here. "sources" is left alone deliberately - nCine asks for 64 (ALAudioDevice.h:93) and capping
# it lower would starve its pool.
[general]
resampler = point
hrtf = false
stereo-mode = speakers
