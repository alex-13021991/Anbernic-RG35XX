# Дополнительные папки, по одному абсолютному пути в строке.
# Обычно этот файл менять не требуется.
# Автоматически читаются Screenshots/screenshots на TF1 и TF2,
# CFW/retroarch/.retroarch/screenshots и screenshot_directory из retroarch.cfg.
# Подпапки сканируются; символические ссылки внутри папок пропускаются.
# Допускаются только пути внутри /mnt/mmc и /mnt/SDCARD.
# Пример (уберите #, если ваши скриншоты находятся здесь):
# /mnt/SDCARD/MyScreenshots
